name: CLIP_DISTS_KADID10K
model_type: KADID10KDISTSModel
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: KADID10K_train
    type: KADID10KJsonlDataset
    jsonl_path: /path/to/kadid10k_train.jsonl
    image_root: /path/to/kadid10k/images
    gt_size: 224
    use_hflip: true
    use_rot: true
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: KADID10K_val
    type: KADID10KJsonlDataset
    jsonl_path: /path/to/kadid10k_val.jsonl
    image_root: /path/to/kadid10k/images
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]

network_dhead:
  type: AFINEDhead
  chns: [3, 768, 768, 768, 768, 768, 768, 768, 768, 768, 768, 768, 768]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
path_dhead:
  pretrain_network_dhead: ~
  strict_load_dhead: true
  param_key_dhead: params
path_CLIP:
  pretrain_CLIP_path: experiments/pretrained_models/CLIP/ViT-B-16.pt
  mode: Original

score:
  min: 1.0
  max: 5.0
  higher_better: true

train:
  finetune_CLIP: false
  optim_dhead:
    type: AdamW
    lr: !!float 5e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [10000, 10000, 10000, 10000]
    restart_weights: [1, 0.5, 0.5, 0.5]
    eta_min: !!float 1e-8
  total_iter: 40000
  warmup_iter: -1
  mos_opt:
    type: MOSRegressionLoss
    loss_weight: 1.0
    ranking_weight: 0.1

val:
  val_freq: !!float 5e2
  save_img: false
  logistic_mapping: true
  metrics:
    SRCC: {better: higher}
    PLCC: {better: higher}
    KRCC: {better: higher}
    RMSE: {better: lower}

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e2
  use_tb_logger: true
  wandb: {project: ~, resume_id: ~}
dist_params: {backend: nccl, port: 29500}
